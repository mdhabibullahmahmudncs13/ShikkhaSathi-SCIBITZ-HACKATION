version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shikkhasathi_postgres
    environment:
      POSTGRES_DB: shikkhasathi
      POSTGRES_USER: shikkhasathi_user
      POSTGRES_PASSWORD: shikkhasathi_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - shikkhasathi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shikkhasathi_user -d shikkhasathi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: shikkhasathi_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: shikkhasathi_user
      MONGO_INITDB_ROOT_PASSWORD: shikkhasathi_pass
      MONGO_INITDB_DATABASE: shikkhasathi
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - shikkhasathi_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shikkhasathi_redis
    command: redis-server --appendonly yes --requirepass shikkhasathi_pass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - shikkhasathi_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: shikkhasathi_chromadb
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8001:8000"
    networks:
      - shikkhasathi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for Local AI
  ollama:
    image: ollama/ollama:latest
    container_name: shikkhasathi_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - shikkhasathi_network
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shikkhasathi_backend
    environment:
      - DATABASE_URL=postgresql://shikkhasathi_user:shikkhasathi_pass@postgres:5432/shikkhasathi
      - MONGODB_URL=mongodb://shikkhasathi_user:shikkhasathi_pass@mongodb:27017/shikkhasathi
      - REDIS_URL=redis://:shikkhasathi_pass@redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENVIRONMENT=production
      - SECRET_KEY=your-super-secret-key-change-in-production
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://frontend:3000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    networks:
      - shikkhasathi_network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # WebSocket Signaling Server
  websocket:
    build:
      context: ./backend
      dockerfile: Dockerfile.websocket
    container_name: shikkhasathi_websocket
    ports:
      - "8002:8001"
    networks:
      - shikkhasathi_network
    healthcheck:
      test: ["CMD", "python", "-c", "import websockets; print('WebSocket server ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shikkhasathi_frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8002
    ports:
      - "3000:3000"
    networks:
      - shikkhasathi_network
    depends_on:
      - backend
      - websocket
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: shikkhasathi_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - shikkhasathi_network
    depends_on:
      - frontend
      - backend
      - websocket
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  ollama_data:
    driver: local

networks:
  shikkhasathi_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16