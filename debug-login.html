<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Debug Test</title>
</head>
<body>
    <h1>Login Debug Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing login...';
            
            try {
                console.log('Testing login API...');
                
                const response = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                resultDiv.innerHTML = `
                    <h3>Login Success!</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                // Test getting current user
                if (data.access_token) {
                    console.log('Testing getCurrentUser...');
                    const userResponse = await fetch('http://localhost:8000/api/v1/users/me', {
                        headers: {
                            'Authorization': `Bearer ${data.access_token}`
                        }
                    });
                    
                    if (userResponse.ok) {
                        const userData = await userResponse.json();
                        console.log('User data:', userData);
                        resultDiv.innerHTML += `
                            <h3>User Data:</h3>
                            <pre>${JSON.stringify(userData, null, 2)}</pre>
                        `;
                    } else {
                        console.error('Failed to get user data:', userResponse.status);
                        resultDiv.innerHTML += `<p>Failed to get user data: ${userResponse.status}</p>`;
                    }
                }
                
            } catch (error) {
                console.error('Login test failed:', error);
                resultDiv.innerHTML = `
                    <h3>Login Failed!</h3>
                    <p>Error: ${error.message}</p>
                    <p>Check browser console for details</p>
                `;
            }
        }
    </script>
</body>
</html>
